name: legacy_notebook
description: Field Credit Collection & Home Appliance Sales Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6

  # Routing
  go_router: ^14.2.0

  # Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Fonts & Icons
  google_fonts: ^6.2.1

  # Storage
  shared_preferences: ^2.2.2
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.2
  supabase_flutter: ^2.6.0
  path_provider: ^2.1.3
  path: ^1.9.0

  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.2.5
  permission_handler: ^12.0.3
  geolocator: ^14.0.2
  file_picker: ^8.1.2
  google_maps_flutter: ^2.17.1
  geocoding: ^4.0.0
  image_picker: ^1.2.3
  open_filex: ^4.7.0
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.7.1
  riverpod_generator: ^4.0.8

flutter:
  uses-material-design: true
  generate: true
