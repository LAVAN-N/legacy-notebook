name: legacy_notebook
description: Field Credit Collection & Home Appliance Sales Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Fonts & Icons
  google_fonts: ^6.2.1

  # Storage
  shared_preferences: ^2.2.2

  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.2.5
  permission_handler: ^12.0.3
  geolocator: ^14.0.2
  file_picker: ^8.1.2
  google_maps_flutter: ^2.17.1
  geocoding: ^4.0.0
  image_picker: ^1.2.3
  camera: ^0.12.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.7.1
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  generate: true
